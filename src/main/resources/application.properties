server.port=${PORT:8080}
# --- THYMELEAF CONFIGURATION ---
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# --- GOOGLE GEMINI AI CONFIGURATION ---
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY}

# Configurable Gemini model endpoint URL. Uses gemini-2.5-flash which is fast and cost-effective.
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent

# --- LOGGING CONFIGURATION ---
# Set logging level for the application package to output debug/info traces
logging.level.com.example.pdfanalyzer=INFO
logging.level.org.springframework.web=INFO
